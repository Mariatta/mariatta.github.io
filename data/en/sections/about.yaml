# a summary about you
summary: "Multi-award winning open source maintainer and contributor. As a Python core developer, my main focus is to improve the core workflow and documentation. I'm active in the Python community as an advisor and administrator for the Global PyLadies, co-founder of PyCascades, and I've chaired PyCon US, PyCascades, and PyLadiesCon.

For my contributions to Python and the community, I've been awarded the Microsoft Most Valuable Professional (MVP) award in Developer Technologies in 2026. I'm a Fellow member of the Python Software Foundation, and I've received the PSF Community Service Award in 2018 and the Google Open Source Peer Bonus Award in 2017 and 2020."

